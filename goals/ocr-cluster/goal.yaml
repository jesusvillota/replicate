format: goal/v2
id: ocr-cluster
title: OCR three papers on the SLURM cluster
objective: Produce machine-readable text for all three PDFs with Marker, Chandra, PaddleOCR, and paperextract, running all inference on the SLURM cluster and never on the MacBook.
base: main
success:
  SC-1: Marker output covers all three PDFs, verified by `ls ocr/marker/`.
  SC-2: Chandra output covers all three PDFs, verified by `ls ocr/chandra/`.
  SC-3: PaddleOCR output covers all three PDFs, verified by `ls ocr/paddleocr/`.
  SC-4: paperextract output covers all three PDFs, verified by `ls ocr/paperextract/`.
milestones:
  - {id: M-1, title: Cluster OCR outputs for all three papers, success: [SC-1, SC-2, SC-3, SC-4], exit: Four task PRs merged into main}
policy:
  decide: human         # human | experts (a committee answers worker decision requests)
  orchestrate: you      # you | agent: an orchestrator agent approves, dispatches and merges 
  routing: fixed        # with an orchestrator: fixed respects each task's route; dynamic lets it choose
  orchestrator: null    # {platform: codex, model: MODEL, effort: LEVEL}
  max_parallel: 2
  default_route: {platform: codex, model: gpt-6-luna, effort: max}   # {platform: codex, model: MODEL, effort: LEVEL}
  agent: claude         # claude | codex | opencode | agy
  turn_budget: 40
  plan_commits: push    # push | commit | off
  worktree_setup: null  # shell run in each new task worktree, e.g. "uv sync"
